version: '3.8'

networks:
  livguinar_frontend:
    driver: bridge
  livguinar_backend:
    driver: bridge

volumes:
  db_data:
    driver: local
  ssl_certs:

services:
  # 📡 LE REVERSE PROXY NGINX (Périmètre Sécurité & Routage)
  nginx:
    image: nginx:alpine
    container_name: livguinar_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/letsencrypt
    networks:
      - livguinar_frontend
    depends_on:
      - app

  # 🐍 L'APPLICATION BACKEND FLASK & WEBSOCKETS (Passerelle Réseau)
  app:
    build: ./app
    container_name: livguinar_backend_app
    restart: always
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=mysql+pymysql://root:Eternel@Fall76@db/livguinar_db
      - GEMINI_API_KEY=AQ.Ab8RN6LRySGm7VpSFTPj4rkTjZg-rgAutKAJFFPSmHT77qmm4Q
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Eternel@Fall76
      - MYSQL_DATABASE=livguinar_db
    volumes:
      - ./app:/app
    networks:
      - livguinar_frontend
      - livguinar_backend
    depends_on:
      - db

  # 🗄️ LA BASE DE DONNÉES MARIADB (Cloisonnée et Isolée)
  db:
    image: mariadb:10.11
    container_name: livguinar_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Eternel@Fall76
      MYSQL_DATABASE: livguinar_db
      MYSQL_USER: FBD
      MYSQL_PASSWORD: Eternel@Fall76
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - livguinar_backend