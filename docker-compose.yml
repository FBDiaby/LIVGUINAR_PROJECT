version: '3.8'

networks:
  livguinar_frontend:
    driver: bridge
  livguinar_backend:
    driver: bridge

volumes:
  db_data:
    driver: local
  ssl_certs:

services:
  # 📡 LE REVERSE PROXY NGINX (Périmètre Sécurité & Routage)
  nginx:
    image: nginx:alpine
    container_name: livguinar_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/letsencrypt
    networks:
      - livguinar_frontend
    depends_on:
      - app

  # 🐍 L'APPLICATION BACKEND FLASK & WEBSOCKETS (Passerelle Réseau)
# 🐍 L'APPLICATION BACKEND FLASK & WEBSOCKETS (Passerelle Réseau)
  app:
    build: ./app
    container_name: livguinar_backend_app
    restart: always
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@${MYSQL_HOST}/${MYSQL_DATABASE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - ./app:/app
    networks:
      - livguinar_frontend
      - livguinar_backend
    depends_on:
      - db

  # 🗄️ LA BASE DE DONNÉES MARIADB (Cloisonnée et Isolée)
  db:
    image: mariadb:10.11
    container_name: livguinar_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - livguinar_backend  