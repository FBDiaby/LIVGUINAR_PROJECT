<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant Liv'Guinar+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: #FDFBF7;">

    <header class="app-header" style="padding-bottom: 15px;">
        <div class="header-top">
            <button class="icon-btn" onclick="window.location.href='/'">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="brand-title">
                <h1>Assistant LivGuinar+</h1>
                <span class="sub-welcome" style="opacity: 0.9;">Wolof • Sérère • Français</span>
            </div>
            <div style="width: 24px;"></div> </div>

        <div style="display: flex; gap: 8px; padding: 5px 20px 0 20px;">
            <span style="background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: bold;">SN Wolof</span>
            <span style="background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: bold;">SN Sérère</span>
            <span style="background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: bold;">FR Français</span>
        </div>
    </header>

    <main class="main-content" id="chat-container" style="margin-bottom: 90px; min-height: calc(100vh - 190px); overflow-y: auto;">
        
        <div class="chat-bubble-wrapper bot">
            <div class="bot-avatar">
                <i class="fa-solid fa-sparkles"></i>
            </div>
            <div class="chat-bubble">
                <p>Bonjour ! Je suis votre assistant Liv'Guinar+. Parlez-moi en Wolof, Sérère ou Français — je comprends les trois. Comment puis-je vous aider ?</p>
                <span class="chat-time">En ligne</span>
            </div>
        </div>

    </main>

    <div class="chat-input-container">
        <div class="chat-input-box">
            <input type="text" id="text-input" placeholder="Appuyez sur le micro pour parler ou écrivez ici...">
            <button class="voice-trigger-btn" id="mic-btn">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>
    </div>

    <footer class="app-footer">
        <button class="nav-item" onclick="window.location.href='/'">
            <i class="fa-solid fa-house"></i>
            <span>Accueil</span>
        </button>
        <button class="nav-item">
            <i class="fa-solid fa-store"></i>
            <span>Boutique</span>
        </button>
        <button class="nav-item">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>Suivi</span>
        </button>
        <button class="nav-item active">
            <i class="fa-solid fa-microphone"></i>
            <span>Assistant</span>
        </button>
    </footer>

    <script src="{{ url_for('static', filename='js/assistant-chat.js') }}"></script>
</body>
</html>
